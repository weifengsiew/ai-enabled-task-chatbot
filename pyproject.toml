[project]
name = "bao"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1.0",
    "streamlit>=1.40",
]

[project.scripts]
bao = "bao.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
